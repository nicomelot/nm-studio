name: NM Studio checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  addon-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nm-control-test nm_bridge
      - run: docker run --rm --entrypoint python3 nm-control-test -c "import pyzipper; import bridge"
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r nm_bridge/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.js
  home-assistant-schema:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ha: ['2026.10.4', '2026.11.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tests/make_ha_lab_fixture.py /tmp/nm-ha-check
      - name: Validate virtual package with Home Assistant
        run: docker run --rm -v /tmp/nm-ha-check:/config ghcr.io/home-assistant/home-assistant:${{ matrix.ha }} python -m homeassistant --script check_config -c /config
      - name: Validate real KNX panel payloads without bus access
        run: docker run --rm -v "$PWD:/work:ro" ghcr.io/home-assistant/home-assistant:${{ matrix.ha }} python /work/tests/check_knx_panel_schema.py
