<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;padding:24px;background:#0c1a16;color:#e5efe9;font:15px system-ui;--card-background-color:#162c23;--secondary-background-color:#233b31;--primary-text-color:#e5efe9;--secondary-text-color:#a8bfb2;--primary-color:#00d7a3;--divider-color:#426454}nm-climate-card{display:block;max-width:650px;margin:20px auto}button{padding:12px}</style><h1>Collaudo termostato · dati simulati</h1><button id="filter">Simula allarme filtro</button><button id="offline">Simula termostato non disponibile</button><script src="../nm_bridge/nm-climate-card.js"></script><nm-climate-card></nm-climate-card><script>
const card=document.querySelector('nm-climate-card'),schedule={days:Array.from({length:7},(_,i)=>'input_text.day_'+i),commit:'input_text.commit',status:'input_text.status'};
const states={'climate.demo':{entity_id:'climate.demo',state:'heat',attributes:{friendly_name:'SIM · Termostato Sentire',current_temperature:20.5,temperature:21,min_temp:7,max_temp:30,target_temp_step:.5,hvac_modes:['off','heat','cool','fan_only','dry','auto'],fan_modes:['auto','low','medium','high'],fan_mode:'auto',swing_modes:['off','on'],swing_mode:'off'}},'input_boolean.filter':{entity_id:'input_boolean.filter',state:'off',attributes:{}},'input_boolean.fan':{entity_id:'input_boolean.fan',state:'on',attributes:{}},'input_number.vane':{entity_id:'input_number.vane',state:'50',attributes:{min:0,max:100,step:1}}};
for(const id of [...schedule.days,schedule.commit,schedule.status])states[id]={entity_id:id,state:'',last_updated:new Date().toISOString(),attributes:{}};
const hass={states,config:{time_zone:'Europe/Rome'},async callService(domain,service,data){const s=states[data.entity_id];if(!s)throw Error('Entità non presente');if(service==='set_value')s.state=String(data.value);else if(service==='set_temperature')s.attributes.temperature=data.temperature;else if(service==='set_hvac_mode')s.state=data.hvac_mode;else if(service==='set_fan_mode')s.attributes.fan_mode=data.fan_mode;else if(service==='set_swing_mode')s.attributes.swing_mode=data.swing_mode;else if(service==='turn_on')s.state='on';else if(service==='turn_off')s.state='off';s.last_updated=new Date().toISOString();s.last_changed=s.last_updated;card.hass={...hass};return {}}};
card.setConfig({type:'custom:nm-climate-card',entity:'climate.demo',name:'SIM · Termostato Sentire',filter_alarm:'input_boolean.filter',fan_auto:'input_boolean.fan',vane_position:'input_number.vane',schedule});card.hass=hass;
document.querySelector('#filter').onclick=()=>{states['input_boolean.filter'].state=states['input_boolean.filter'].state==='on'?'off':'on';card.hass={...hass}};
document.querySelector('#offline').onclick=()=>{states['climate.demo'].state=states['climate.demo'].state==='unavailable'?'heat':'unavailable';card.hass={...hass}};
</script>
