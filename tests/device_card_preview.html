<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#15171b;color:#eee;font:16px system-ui;padding:20px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}nm-device-card{display:block}button{font:inherit}</style><h1>SIM · Luci e tapparelle</h1><script src="../nm_bridge/nm-climate-card.js"></script><script src="../nm_bridge/nm-device-card.js"></script><main><nm-device-card id="light"></nm-device-card><nm-device-card id="cover"></nm-device-card></main><script>
customElements.whenDefined('nm-device-card').then(()=>{const states={'light.demo':{entity_id:'light.demo',state:'off',attributes:{friendly_name:'SIM · Luce',supported_color_modes:['brightness'],brightness:128}},'cover.demo':{entity_id:'cover.demo',state:'closed',attributes:{friendly_name:'SIM · Tapparella',supported_features:15,current_position:0}}};const cards=[...document.querySelectorAll('nm-device-card')];const hass={states,config:{time_zone:'Europe/Rome'},async callService(domain,service,data){const s=states[data.entity_id];if(service==='set_value')s.state=data.value;else if(service==='turn_on'){s.state='on';if(data.brightness_pct!==undefined)s.attributes.brightness=Math.round(data.brightness_pct*2.55)}else if(service==='turn_off')s.state='off';else if(service==='open_cover'){s.state='open';s.attributes.current_position=100}else if(service==='close_cover'){s.state='closed';s.attributes.current_position=0}else if(service==='set_cover_position'){s.state=data.position>0?'open':'closed';s.attributes.current_position=data.position}s.last_updated=new Date().toISOString();for(const c of cards)c.hass={...hass}}};for(const c of cards){const schedule={days:Array.from({length:7},(_,i)=>'input_text.'+c.id+i),commit:'input_text.'+c.id+'commit',status:'input_text.'+c.id+'status'};for(const id of [...schedule.days,schedule.commit,schedule.status])states[id]={entity_id:id,state:'unknown',attributes:{}};c.setConfig({entity:c.id+'.demo',schedule});c.hass=hass}});
</script>
