<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#15171b;color:#eee;font:16px system-ui;padding:20px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}</style><h1>SIM · Preferiti</h1><script src="../nm_bridge/nm-climate-card.js?v=542"></script><script src="../nm_bridge/nm-device-card.js?v=542"></script><main><section><h2>Ambiente</h2><nm-device-card id="source"></nm-device-card></section><section><h2>Preferiti</h2><nm-favorites-card id="favorites"></nm-favorites-card></section></main><script>
customElements.whenDefined('nm-device-card').then(()=>{const states={'light.demo':{entity_id:'light.demo',state:'off',attributes:{friendly_name:'SIM · Luce'}},'input_boolean.nm_favorite_0123456789abcdef0123':{state:'off',attributes:{}}};const card={type:'custom:nm-device-card',entity:'light.demo',name:'SIM · Luce',schedule:{commit:'input_text.nm_week_0123456789abcdef0123_commit'}};const source=document.querySelector('#source'),favorites=document.querySelector('#favorites');const hass={states,async callService(domain,service,data){if(domain!=='input_boolean')throw Error('Solo preferenze in questa prova');states[data.entity_id].state=service==='turn_on'?'on':'off';source.hass={...hass};favorites.hass={...hass}}};source.setConfig(card);favorites.setConfig({cards:[card]});source.hass=hass;favorites.hass=hass;});
</script>
