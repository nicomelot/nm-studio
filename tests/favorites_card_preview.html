<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#15171b;color:#eee;font:16px system-ui;padding:12px;max-width:420px;margin:auto}</style><h1>SIM · Preferiti</h1><p>Trascina le maniglie. Nessun comando ai dispositivi.</p><script src="../nm_bridge/nm-climate-card.js?v=543"></script><script src="../nm_bridge/nm-device-card.js?v=543"></script><nm-favorites-card id="favorites"></nm-favorites-card><p id="result" role="status"></p><script>
customElements.whenDefined('nm-device-card').then(()=>{const states={},cards=[1,2,3,4,5].map(i=>{const id=String(i).padStart(20,'0');states['light.demo'+i]={state:'off',attributes:{}};states['input_boolean.nm_favorite_'+id]={state:'on',attributes:{}};states['input_number.nm_favorite_order_'+id]={state:localStorage.getItem('rank'+i)||'0',attributes:{}};return {type:'custom:nm-device-card',entity:'light.demo'+i,name:'SIM · Luce '+i,schedule:{commit:'input_text.nm_week_'+id+'_commit'}}});const favorites=document.querySelector('#favorites');const hass={states,async callService(domain,service,data){if(domain==='input_number'){states[data.entity_id].state=String(data.value);const i=Number(data.entity_id.slice(-20));localStorage.setItem('rank'+i,data.value);}else if(domain==='input_boolean')states[data.entity_id].state=service==='turn_on'?'on':'off';else throw Error('Comando al dispositivo non consentito');favorites.hass={...hass};document.querySelector('#result').textContent='Salvato · '+domain;}};favorites.setConfig({cards});favorites.hass=hass;});
</script>
