const moduleCatalog={
 knx:{name:'KNX ed ETS',why:'Importa il .knxproj e collega le Functions ETS alle luci e agli altri comandi; quando mancano, assegna manualmente.',checks:['ETS .knxproj disponibile','Funzioni ETS oppure associazioni manuali','GA comando e feedback verificati','Interfaccia KNX/IP verificata'],go:'ets'},

};
const $=id=>document.getElementById(id), escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path,opts={}){let r=await fetch(path,{cache:'no-store',...opts});if(!r.ok){let detail=await r.json().catch(()=>({}));throw Error(detail.error||('HTTP '+r.status))}return r.json()}
async function refresh(){if(refreshing)return;refreshing=true;try{let d=await api('entities');entities=d.entities;entityError='';lastSync=new Date();message('Stati aggiornati · '+entities.length+' entità');}catch(e){entityError=e.message;message('Lettura Home Assistant: '+e.message,true)}finally{refreshing=false}if(page==='intelligence')await loadIntelligence();else if(page==='wizard'||page==='dashboard'||page==='inventory'||page==='diagnostic')render()}
async function init(){try{layout=await api('layout')}catch(e){message('Configurazione non disponibile: '+e.message,true)}try{approvedDevices=(await api('knx/approved')).devices}catch(e){message('Dispositivi KNX approvati non disponibili: '+e.message,true)}try{savedWidgetLayout=await api('knx/widgets');structureDraft=(savedWidgetLayout.structure||[]).map(n=>({...n}))}catch(e){message('Dashboard KNX salvata non disponibile: '+e.message,true)}try{linkDrafts=(await api('nm-link')).links||[]}catch(e){message('Bozze NM Link non disponibili: '+e.message,true)}try{modulePlan=await api('modules/plan')}catch(e){message('Catalogo moduli non disponibile: '+e.message,true)}try{floorArchive=await api('floorplans');floorSelected=floorArchive.plans[0]?.id||''}catch(e){message('Mappe impianto non disponibili: '+e.message,true)}await refresh();try{moduleSuggestions=await api('modules/suggestions')}catch(e){moduleSuggestions=null}if(page==='wizard')render()}
function setPage(p){if(clientMode&&p!=='dashboard')return;if((dirty&&p!=='configure'||linkDirty&&p!=='nm-link'||floorDirty&&p!=='floorplans')&&!confirm('Modifiche non salvate. Uscire?'))return;page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();if(p==='intelligence')loadIntelligence()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('refresh').onclick=refresh;
function applyView(){document.body.classList.toggle('client-mode',clientMode);$('workspace-label').textContent=clientMode?'NM Control · Vista cliente':'NM Studio · Area installatore';$('view-switch').textContent=clientMode?'Torna a NM Studio':'Apri vista cliente';if(clientMode){page='dashboard';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='dashboard'))}history.replaceState(null,'',location.pathname+(clientMode?'?view=client':''));render()}
$('view-switch').onclick=()=>{if(dirty&&!confirm('Modifiche non salvate. Uscire?'))return;clientMode=!clientMode;applyView()};
function widgetType(id){return id.split('.')[0]}
function widgetIcon(type,state){let icons={light:state==='on'?'💡':'◌',cover:'▤',switch:'⏻',climate:'❄',sensor:'◉',binary_sensor:'◈'};return icons[type]||'◉'}
function widgetValue(e,type){if(!e)return 'Non disponibile';if(e.state==='unavailable'||e.state==='unknown')return 'Dato assente';if(type==='light'||type==='switch'||type==='binary_sensor')return e.state==='on'?'Attivo':e.state==='off'?'Spento':e.state;if(type==='cover'&&typeof e.current_position==='number')return Math.round(e.current_position)+'% aperta';if(type==='climate')return (e.current_temperature??'—')+' °C';return e.state+(e.unit?' '+e.unit:'')}
function widgetDetails(e,type){if(!e)return 'Entità non presente';if(type==='light'&&typeof e.brightness==='number')return 'Luminosità '+Math.round(e.brightness/255*100)+'%';if(type==='climate')return 'Modalità '+e.state+(e.temperature!=null?' · Setpoint '+e.temperature+'°C':'')+(e.hvac_action?' · '+e.hvac_action:'');if(type==='cover')return 'Tapparella / tenda';return e.entity_id}
function tile(w){let e=entities.find(x=>x.entity_id===w.entity_id),type=widgetType(w.entity_id),active=e?.state==='on',missing=!e||['unavailable','unknown'].includes(e.state);let progress=type==='light'&&typeof e?.brightness==='number'?Math.round(e.brightness/255*100):type==='cover'&&typeof e?.current_position==='number'?Math.round(e.current_position):null;return `<article class="tile smart ${active?'on':''} ${missing?'unavailable':''}"><div class="smart-top"><span class="smart-label">${escapeHTML({light:'Luce',cover:'Tapparella',switch:'Interruttore',climate:'Clima',sensor:'Sensore',binary_sensor:'Stato'}[type]||'Dispositivo')}</span><span class="smart-icon" aria-hidden="true">${widgetIcon(type,e?.state)}</span></div><div><div class="smart-name">${escapeHTML(w.label||e?.name||w.entity_id)}</div><div class="smart-state">${escapeHTML(widgetValue(e,type))}</div>${progress!==null?`<div class="smart-track"><div class="smart-fill" style="width:${Math.max(0,Math.min(100,progress))}%"></div></div>`:''}<div class="smart-meta">${escapeHTML(widgetDetails(e,type))}</div></div></article>`}
function dashboard(){const n=layout.rooms.reduce((sum,r)=>sum+r.widgets.length,0);let hero=`<div class="dash-hero"><div><div class="smart-label">Panoramica impianto</div><h2>${clientMode?'Benvenuto a casa':'La tua supervisione'}</h2><div class="stats">${layout.rooms.length} ambienti · ${n} dispositivi ${clientMode?'':'· '+entities.length+' entità HA'}</div></div><div><span class="mode-pill">● ${entityError?'Connessione da verificare':'HA collegato'}</span><div class="refresh-indicator">${lastSync?'Ultima lettura '+lastSync.toLocaleTimeString('it-IT'):''} · ogni 15 s</div></div></div>`;if(!layout.rooms.length)return hero+'<div class="empty">Nessun ambiente configurato. Apri NM Studio e crea la prima stanza.</div>';if(selectedRoom!=='all'&&!layout.rooms.some(r=>r.id===selectedRoom))selectedRoom='all';let tabs=`<div class="room-tabs" role="group" aria-label="Seleziona ambiente"><button class="${selectedRoom==='all'?'active':''}" data-select-room="all">Tutti gli ambienti</button>${layout.rooms.map(r=>`<button class="${selectedRoom===r.id?'active':''}" data-select-room="${escapeHTML(r.id)}">${escapeHTML(r.name)}</button>`).join('')}</div>`;let rooms=layout.rooms.filter(r=>selectedRoom==='all'||r.id===selectedRoom);return hero+tabs+rooms.map(r=>`<section class="card"><div class="row" style="justify-content:space-between"><h2>${escapeHTML(r.name)}</h2><span class="selection">${r.widgets.length} dispositivi</span></div>${r.widgets.length?`<div class="grid dashboard-grid">${r.widgets.map(tile).join('')}</div>`:'<p class="muted">Nessun dispositivo associato.</p>'}</section>`).join('')+'<p class="read-only">Stati Home Assistant aggiornati automaticamente ogni 15 secondi quando la pagina è visibile. Nessun comando verso l’impianto.</p>'}
function options(selected){return '<option value="">Seleziona entità…</option>'+entities.map(e=>`<option value="${escapeHTML(e.entity_id)}" ${e.entity_id===selected?'selected':''}>${escapeHTML(e.name)} · ${escapeHTML(e.entity_id)}</option>`).join('')+(selected&&!entities.some(e=>e.entity_id===selected)?`<option value="${escapeHTML(selected)}" selected>${escapeHTML(selected)} (non presente)</option>`:'')}
function configure(){return `<div class="card"><div class="workspace-label">NM Studio</div><h2>Ambienti e associazioni</h2><p class="muted">Configura la visualizzazione: le modifiche vengono salvate localmente, senza inviare comandi a Home Assistant o KNX.</p><div class="bar"><button id="add-room">+ Nuovo ambiente</button><button class="primary" id="save">Salva configurazione</button><span id="unsaved" class="warning">${dirty?'Modifiche non salvate':''}</span></div><p class="config-note">Questa sezione associa le entità presenti in Home Assistant; la scheda Importa ETS genera invece proposte KNX separate, da verificare.</p></div>`+layout.rooms.map((r,i)=>`<div class="card room"><div class="row"><input class="grow room-name" data-room="${i}" maxlength="80" aria-label="Nome ambiente" value="${escapeHTML(r.name)}"><button class="danger remove-room" data-room="${i}">Elimina ambiente</button></div><p class="muted small">Dispositivi associati</p>${r.widgets.map((w,j)=>`<div class="widget-row"><select class="widget-entity" data-room="${i}" data-widget="${j}">${options(w.entity_id)}</select><input class="widget-label" data-room="${i}" data-widget="${j}" maxlength="80" placeholder="Etichetta personalizzata" value="${escapeHTML(w.label)}"><button class="danger remove-widget" data-room="${i}" data-widget="${j}">Rimuovi</button></div>`).join('')}<div class="row"><button class="add-widget" data-room="${i}">+ Associa dispositivo</button><button class="import-ha" data-room="${i}">◎ Suggerisci entità HA</button></div></div>`).join('')}
function inventory(){return `<div class="card"><h2>Entità Home Assistant (${entities.length})</h2>${entityError?`<p class="warning">${escapeHTML(entityError)}</p>`:''}<div style="overflow:auto"><table><thead><tr><th>Entità</th><th>Nome</th><th>Stato</th></tr></thead><tbody>${entities.map(e=>`<tr><td>${escapeHTML(e.entity_id)}</td><td>${escapeHTML(e.name)}</td><td>${escapeHTML(e.state)}</td></tr>`).join('')}</tbody></table></div></div>`}
function ets(){return `<div class="card"><div class="workspace-label">NM Studio · Importazione ETS</div><h2>Analisi progetto KNX</h2><p class="muted">Seleziona un progetto ETS non protetto da password (.knxproj). Verrà analizzato temporaneamente all'interno dell'add-on: il file non viene salvato, non vengono creati widget e non vengono inviati telegrammi.</p><div class="bar"><input type="file" id="ets-file" accept=".knxproj,.zip" style="max-width:460px" aria-label="Progetto ETS"><button class="primary" id="ets-analyze">Analizza progetto</button></div><p id="ets-progress" class="warning">${escapeHTML(etsError)}</p></div>${etsData?`<div class="card"><h2>Indirizzi di gruppo (${etsData.total})</h2><p class="warning">${escapeHTML(etsData.warning)}</p><div class="bar"><button id="ets-download">Esporta analisi JSON</button></div><div style="overflow:auto;max-height:460px"><table><thead><tr><th>Indirizzo</th><th>Nome</th><th>Descrizione</th><th>DPT</th><th>Tipo suggerito</th></tr></thead><tbody>${etsData.addresses.map(e=>`<tr><td>${escapeHTML(e.address)}</td><td>${escapeHTML(e.name)}</td><td>${escapeHTML(e.description)}</td><td>${escapeHTML(e.dpt||'non indicato')}</td><td>${escapeHTML(e.kind)}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h2>Possibili coppie comando / feedback (${etsData.suggestions.length})</h2><p class="muted">Proposte basate esclusivamente sui nomi: controllare sempre il progetto ETS prima di utilizzarle.</p>${etsData.suggestions.length?`<div style="overflow:auto"><table><thead><tr><th>Funzione</th><th>Comando</th><th>Feedback</th><th>Conferma</th></tr></thead><tbody>${etsData.suggestions.map(s=>`<tr><td>${escapeHTML(s.name)}</td><td>${escapeHTML(s.command)}</td><td>${escapeHTML(s.feedback)}</td><td>${escapeHTML(s.confidence)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nessuna coppia univoca identificata; i nomi potrebbero non essere coerenti.</div>'}</div>`:''}`}
function gaOptions(value,allowEmpty=false){return (allowEmpty?'<option value="">Nessun feedback</option>':'')+(etsData?.addresses||[]).map(a=>`<option value="${escapeHTML(a.address)}" ${a.address===value?'selected':''}>${escapeHTML(a.address+' · '+a.name)}</option>`).join('')}
function generator(){if(!etsData)return '';return `<div class="card"><div class="workspace-label">Fase 2 · Revisione installatore</div><h2>Generatore di dispositivi (${candidateDrafts.length} da verificare)</h2><p class="muted">Le tapparelle possono usare più indirizzi: movimento, arresto e posizione. Controlla in ETS direzione e DPT prima di confermare; nessun comando sarà inviato.</p><div class="bar"><button id="knx-add">+ Dispositivo manuale</button><button class="primary" id="knx-confirm">Conferma selezionati e salva</button></div>${candidateDrafts.map((d,i)=>`<div class="card knx-row" style="background:#172b44"><div class="row"><label style="min-width:110px"><input type="checkbox" class="knx-check" data-i="${i}" style="width:auto;margin-right:8px" ${d.selected?'checked':''}>Verificato</label><input class="knx-name grow" maxlength="80" aria-label="Nome dispositivo" value="${escapeHTML(d.name)}"><select class="knx-kind" style="max-width:160px">${['light','dimmer','cover','climate','binary','unknown'].map(k=>`<option value="${k}" ${d.kind===k?'selected':''}>${escapeHTML(k)}</option>`).join('')}</select></div><div class="row" style="margin-top:10px"><label class="grow">Comando / movimento<select class="knx-command">${gaOptions(d.command)}</select></label><label class="grow">Feedback<select class="knx-feedback">${gaOptions(d.feedback,true)}</select></label></div><div class="row" style="margin-top:10px"><label class="grow">Arresto (solo tapparella)<select class="knx-stop" ${d.kind==='cover'?'':'disabled'}>${gaOptions(d.stop,true)}</select></label><label class="grow">Posizione (solo tapparella, funzione da verificare)<select class="knx-position" ${d.kind==='cover'?'':'disabled'}>${gaOptions(d.position,true)}</select></label></div><div class="row" style="margin-top:10px"><label class="grow">Ambiente proposto<input class="knx-room" maxlength="80" value="${escapeHTML(d.room||'Da assegnare')}" aria-label="Ambiente dispositivo"></label></div><div class="small muted">Proposta: ${escapeHTML(d.command)} · Attendibilità ${escapeHTML(d.confidence||'manuale')} · ${escapeHTML(d.reason||'Inserimento manuale')}</div></div>`).join('')||'<div class="empty">Tutte le proposte rilevate sono già approvate. Puoi aggiungere un dispositivo manuale scegliendo un indirizzo.</div>'}<p class="warning" id="knx-status"></p></div>`}
function approvedView(){return `<div class="card"><div class="workspace-label">Archivio NM Studio</div><h2>Dispositivi KNX approvati (${approvedDevices.length})</h2><p class="muted">Associazioni salvate nel laboratorio. Non creano entità HA, non controllano il bus e non sono ancora mostrate nella dashboard cliente.</p>${approvedDevices.length?`<div style="overflow:auto"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Comando</th><th>Feedback</th></tr></thead><tbody>${approvedDevices.map(d=>`<tr><td>${escapeHTML(d.name)}</td><td>${escapeHTML(d.kind)}</td><td>${escapeHTML(d.command)}</td><td>${escapeHTML(d.feedback||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nessuna associazione confermata.</div>'}</div>`}
function etsAudit(){if(!etsData)return '';let unlinked=etsData.addresses.filter(a=>!a.linked),devices=etsData.devices||[];return `<div class="card"><div class="workspace-label">NM ETS Analyzer · Oggetti applicativi</div><h2>Analisi avanzata dei collegamenti KNX</h2><p class="muted">${devices.length} dispositivi · ${devices.filter(d=>d.catalog_read).length} con applicazione decodificata · ${etsData.addresses.length-unlinked.length} indirizzi collegati · ${unlinked.length} non collegati. Dati dal file ETS, non dal bus.</p><div style="overflow:auto;max-height:420px"><table><thead><tr><th>GA</th><th>Nome</th><th>Collegamenti</th><th>Oggetti (nome · funzione · dimensione · flag)</th></tr></thead><tbody>${etsData.addresses.map(a=>`<tr><td>${escapeHTML(a.address)}</td><td>${escapeHTML(a.name)}</td><td>${a.linked?'<span style="color:#8de2a9">Collegato</span>':'<span class="warning">Non collegato</span>'}</td><td>${(a.connections||[]).map(c=>`<div style="margin-bottom:8px"><b>${escapeHTML(c.device)}</b> · ${escapeHTML(c.name||c.object_ref)} · ${escapeHTML(c.function||'?')} · ${escapeHTML(c.size||'?')}<div class="small muted">${c.flags?'C'+Number(c.flags.CommunicationFlag)+' R'+Number(c.flags.ReadFlag)+' W'+Number(c.flags.WriteFlag)+' T'+Number(c.flags.TransmitFlag)+' U'+Number(c.flags.UpdateFlag):'Flag non disponibili'}</div></div>`).join('')||'—'}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h2>Inventario dispositivi ETS (${devices.length})</h2><p class="muted">I riferimenti di prodotto e applicazione sono identificatori tecnici; nomi commerciali completi e indirizzi individuali verranno normalizzati nelle prossime versioni.</p><div style="overflow:auto;max-height:330px"><table><thead><tr><th>Descrizione</th><th>Prodotto ETS</th><th>Oggetti decodificati</th></tr></thead><tbody>${devices.map(d=>`<tr><td>${escapeHTML(d.name)}</td><td class="small">${escapeHTML(d.product_ref)}</td><td>${d.catalog_read?'Sì':'Non disponibili'}</td></tr>`).join('')}</tbody></table></div></div>`}
function etsOverview(){if(!etsData)return '';let addresses=etsData.addresses,devices=etsData.devices||[],unlinked=addresses.filter(a=>!a.linked),notDecoded=devices.filter(d=>!d.catalog_read);return `<div class="card"><div class="workspace-label">NM Studio · Report progetto</div><h2>Controlli preliminari</h2><p class="muted">Le segnalazioni indicano elementi da verificare, non necessariamente errori. Un indirizzo senza collegamenti può essere intenzionalmente predisposto.</p><div class="grid"><div class="tile"><b>Indirizzi scollegati</b><div class="value">${unlinked.length}</div><div class="muted small">Da verificare in ETS</div></div><div class="tile"><b>Applicazioni non decodificate</b><div class="value">${notDecoded.length}</div><div class="muted small">Analisi parziale, non guasto</div></div><div class="tile"><b>Proposte funzionali</b><div class="value">${etsData.suggestions.length}</div><div class="muted small">Conferma manuale necessaria</div></div></div><div class="bar" style="margin-top:18px"><input id="audit-search" placeholder="Cerca indirizzo, dispositivo, oggetto…" aria-label="Cerca nei collegamenti" style="max-width:420px"><select id="audit-filter" aria-label="Filtra indirizzi" style="max-width:230px"><option value="all">Tutti gli indirizzi</option><option value="unlinked">Solo non collegati</option><option value="linked">Solo collegati</option></select><button id="audit-export">Esporta report JSON</button><span id="audit-count" class="small muted"></span></div></div>`}
function deviceDetail(){if(!etsData)return '';let d=(etsData.devices||[]).find(x=>x.id===selectedPhysicalDevice);if(!d)return '<div class="empty">Seleziona un dispositivo per visualizzare gli oggetti collegati.</div>';let links=etsData.addresses.flatMap(a=>(a.connections||[]).filter(c=>c.device_id===d.id).map(c=>({...c,address:a.address,ga_name:a.name,dpt:a.dpt,role:a.role})));return `<div class="grid" style="margin:15px 0"><div class="tile"><b>Indirizzi di gruppo</b><div class="value">${new Set(links.map(x=>x.address)).size}</div><p class="small muted">Collegamenti visibili nell'archivio ETS</p></div><div class="tile"><b>Oggetti collegati</b><div class="value">${d.connected_objects}</div><p class="small muted">Oggetti con almeno un link nel file</p></div><div class="tile"><b>Catalogo applicativo</b><div class="value" style="font-size:17px">${d.catalog_read?'Decodificato':'Parziale'}</div><p class="small muted">${escapeHTML(d.product_ref||'Prodotto non identificato')}</p></div></div>${d.linked_addresses>links.length?`<p class="warning">Visualizzazione parziale: ${d.linked_addresses} collegamenti rilevati, ${links.length} mostrati (limite di 12 oggetti per indirizzo).</p>`:''}<div style="overflow:auto;max-height:450px"><table><thead><tr><th>GA</th><th>Nome GA</th><th>Oggetto / funzione</th><th>DPT GA</th><th>Flag ETS</th></tr></thead><tbody>${links.map(c=>`<tr><td>${escapeHTML(c.address)}</td><td>${escapeHTML(c.ga_name)}</td><td><b>${escapeHTML(c.name||c.object_ref)}</b><div class="small muted">${escapeHTML(c.function||'Funzione non indicata')} · ${escapeHTML(c.size||'Dimensione non indicata')}</div></td><td>${escapeHTML(c.dpt||'Non assegnato')}</td><td class="small">${c.flags?'C'+Number(c.flags.CommunicationFlag)+' R'+Number(c.flags.ReadFlag)+' W'+Number(c.flags.WriteFlag)+' T'+Number(c.flags.TransmitFlag)+' U'+Number(c.flags.UpdateFlag):'Non disponibili'}</td></tr>`).join('')||'<tr><td colspan="5">Nessun collegamento rilevato nel progetto.</td></tr>'}</tbody></table></div><p class="small muted">Questa scheda mostra solo i collegamenti presenti nell'esportazione ETS; non certifica il funzionamento sul bus né l'assenza di oggetti non collegati.</p>`}
function unlinkedDetails(){if(!etsData)return '';let d=(etsData.devices||[]).find(x=>x.id===selectedPhysicalDevice);if(!d)return '';let list=d.unlinked_objects||[];return `<div style="margin-top:24px;border-top:1px solid #426080;padding-top:17px"><h2>Oggetti senza indirizzo di gruppo (${d.unlinked_count||0})</h2><p class="muted">Oggetti istanziati nel progetto ETS con campo Links vuoto. Non sono automaticamente errori né feedback: possono essere predisposizioni o funzioni non usate. Gli oggetti non istanziati non sono elencati.</p>${d.unlinked_count>list.length?`<p class="warning">Elenco limitato ai primi ${list.length} oggetti su ${d.unlinked_count}.</p>`:''}<div style="overflow:auto;max-height:340px"><table><thead><tr><th>Numero</th><th>Oggetto</th><th>Funzione</th><th>Dimensione</th><th>Flag ETS</th></tr></thead><tbody>${list.map(o=>`<tr><td>${escapeHTML(o.number??'—')}</td><td>${escapeHTML(o.name||o.object_ref)}</td><td>${escapeHTML(o.function||'—')}</td><td>${escapeHTML(o.size||'—')}</td><td class="small">${o.flags?'C'+Number(o.flags.CommunicationFlag)+' R'+Number(o.flags.ReadFlag)+' W'+Number(o.flags.WriteFlag)+' T'+Number(o.flags.TransmitFlag)+' U'+Number(o.flags.UpdateFlag):'Non disponibili'}</td></tr>`).join('')||'<tr><td colspan="5">Nessun oggetto istanziato senza Links.</td></tr>'}</tbody></table></div></div>`}
function catalogCandidateDetails(){if(!etsData)return '';let d=(etsData.devices||[]).find(x=>x.id===selectedPhysicalDevice);if(!d)return '';let list=d.catalog_candidates||[];return `<div style="margin-top:24px;border-top:1px solid #426080;padding-top:17px"><h2>Oggetti nel catalogo del produttore (${d.catalog_candidates_count||0})</h2><p class="warning">Possibilità applicative, NON oggetti certamente attivi: non compaiono tra le istanze del progetto. ETS potrebbe averli disattivati tramite parametri. Non usarli come indirizzi o feedback verificati.</p>${d.catalog_candidates_count>list.length?`<p class="small muted">Sono visibili i primi ${list.length} elementi.</p>`:''}<div style="overflow:auto;max-height:350px"><table><thead><tr><th>Numero</th><th>Nome da catalogo</th><th>Funzione</th><th>Dimensione</th></tr></thead><tbody>${list.map(o=>`<tr><td>${escapeHTML(o.number??'—')}</td><td>${escapeHTML(o.name||o.object_ref)}</td><td>${escapeHTML(o.function||'—')}</td><td>${escapeHTML(o.size||'—')}</td></tr>`).join('')||'<tr><td colspan="4">Nessuna ulteriore voce di catalogo disponibile per questa applicazione.</td></tr>'}</tbody></table></div></div>`}
function etsDeviceExplorer(){if(!etsData)return '';let ds=etsData.devices||[];if(!selectedPhysicalDevice&&!ds.length)return '';if(!ds.some(d=>d.id===selectedPhysicalDevice))selectedPhysicalDevice=ds[0]?.id||'';return `<section class="card"><div class="workspace-label">NM Studio · Scheda tecnica KNX</div><h2>Esplora dispositivi fisici (${ds.length})</h2><p class="muted">Collegamenti, oggetti istanziati senza indirizzo e funzioni del catalogo produttore. Sono tre categorie diverse: la presenza nel catalogo non dimostra l'attivazione in ETS.</p><label>Dispositivo ETS<select id="physical-device" style="margin:9px 0 14px">${ds.map((d,i)=>`<option value="${escapeHTML(d.id)}" ${d.id===selectedPhysicalDevice?'selected':''}>${i+1}. ${escapeHTML(d.name)} · ${escapeHTML((d.product_ref||'').split('_P-').pop())} · addr. ${escapeHTML(d.address_suffix||'?')} · ${d.connected_objects} collegati / ${d.unlinked_count||0} liberi</option>`).join('')}</select></label><div id="device-detail">${deviceDetail()+unlinkedDetails()+catalogCandidateDetails()}</div></section>`}
function wireDeviceExplorer(){let sel=$('physical-device');if(sel)sel.onchange=()=>{selectedPhysicalDevice=sel.value;$('device-detail').innerHTML=deviceDetail()+unlinkedDetails()+catalogCandidateDetails()}}
function etsReview(){if(!etsData)return '';let unlinked=etsData.addresses.filter(a=>!a.linked);return `<div class="card"><div class="workspace-label">NM Studio · Revisione installatore</div><h2>Registro verifiche (${unlinked.length} indirizzi senza collegamenti)</h2><p class="muted">Classifica le segnalazioni senza modificare il progetto ETS. Le note vengono salvate localmente per questo progetto.</p>${unlinked.map(a=>{let r=auditReviews[a.address]||{status:'todo',note:''};return `<div class="card review-row" data-ga="${escapeHTML(a.address)}" style="background:#172b44"><div class="row"><b>${escapeHTML(a.address)} · ${escapeHTML(a.name)}</b><select class="review-status" aria-label="Stato verifica ${escapeHTML(a.address)}" style="max-width:240px">${[['todo','Da controllare'],['expected','Previsto dal progetto'],['fix','Da correggere'],['verified','Verificato']].map(([v,t])=>`<option value="${v}" ${r.status===v?'selected':''}>${t}</option>`).join('')}</select></div><input class="review-note" maxlength="500" aria-label="Note ${escapeHTML(a.address)}" placeholder="Nota installatore (facoltativa)" value="${escapeHTML(r.note)}" style="margin-top:9px"></div>`}).join('')||'<div class="empty">Nessun indirizzo scollegato da revisionare.</div>'}<div class="bar"><button class="primary" id="review-save">Salva verifiche</button><span id="review-message" class="small muted">${reviewDirty?'Modifiche alle verifiche non salvate':''}</span></div></div>`}
function wireReview(){if(!etsData)return;document.querySelectorAll('.review-row').forEach(row=>{let ga=row.dataset.ga;for(let el of row.querySelectorAll('select,input'))el.oninput=()=>{auditReviews[ga]={status:row.querySelector('.review-status').value,note:row.querySelector('.review-note').value};reviewDirty=true;$('review-message').textContent='Verifiche non salvate'}});$('review-save').onclick=async()=>{try{let entries={};for(let row of document.querySelectorAll('.review-row'))entries[row.dataset.ga]={status:row.querySelector('.review-status').value,note:row.querySelector('.review-note').value};await api('audit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:etsData.project_key,entries})});auditReviews=entries;reviewDirty=false;$('review-message').textContent='Verifiche salvate';message('Registro verifiche salvato')}catch(e){$('review-message').textContent='Errore: '+e.message}}}
function wireAudit(){if(!etsData)return;let rows=[...document.querySelectorAll('#audit-panel > .card:first-child table tbody tr')];function filter(){let q=$('audit-search').value.trim().toLocaleLowerCase('it'),mode=$('audit-filter').value,visible=0;rows.forEach((row,i)=>{let a=etsData.addresses[i],show=(mode==='all'||(mode==='linked'&&a.linked)||(mode==='unlinked'&&!a.linked))&&row.textContent.toLocaleLowerCase('it').includes(q);row.hidden=!show;if(show)visible++});$('audit-count').textContent=visible+' di '+rows.length+' indirizzi'}$('audit-search').oninput=filter;$('audit-filter').onchange=filter;filter();$('audit-export').onclick=()=>{let report={version:1,generated_at:new Date().toISOString(),total:etsData.total,unlinked:etsData.addresses.filter(a=>!a.linked).map(a=>({address:a.address,name:a.name})),catalog_unavailable:(etsData.devices||[]).filter(d=>!d.catalog_read).map(d=>({name:d.name,product_ref:d.product_ref})),suggestions:etsData.suggestions};let blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='nm-studio-ets-report.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
function knxCards(devices,readonly=false){let groups=new Map();for(let d of devices){let room=d.room||'Da assegnare';if(!groups.has(room))groups.set(room,[]);groups.get(room).push(d)}return [...groups].sort((a,b)=>a[0].localeCompare(b[0],'it')).map(([room,list])=>`<section class="card"><div class="row" style="justify-content:space-between"><h2>${escapeHTML(room)}</h2><span class="small muted">${list.length} dispositivi</span></div><div class="grid dashboard-grid">${list.map(d=>`<article class="tile smart"><div class="smart-top"><span class="smart-label">${escapeHTML(({light:'Luce',dimmer:'Dimmer',cover:'Tapparella',climate:'Clima',binary:'Binario',unknown:'Da identificare'})[d.kind]||'Dispositivo')}</span><span class="smart-icon">${({light:'💡',dimmer:'◐',cover:'▤',climate:'❄',binary:'⏻',unknown:'◇'})[d.kind]||'◇'}</span></div><div><div class="smart-name">${escapeHTML(d.name)}</div><div class="smart-state" style="font-size:17px;color:#a9c5ea">${readonly?'Non collegato a HA':'Anteprima'}</div><div class="smart-meta">${escapeHTML(d.command)} → ${escapeHTML(d.feedback||'senza feedback')}</div></div></article>`).join('')}</div></section>`).join('')}
function knxProject(){let drafts=candidateDrafts.filter(d=>!d.selected);return `<div class="dash-hero"><div><div class="smart-label">NM Studio · Modello KNX indipendente</div><h2>Anteprima supervisione KNX</h2><div class="stats">${approvedDevices.length} dispositivi confermati · ${drafts.length} proposte non confermate</div></div><span class="mode-pill">🔒 Nessun comando bus</span></div><p class="muted">Queste schede derivano dagli indirizzi ETS e non da entità HA. Non mostrano stati reali: il collegamento live verrà realizzato in una fase successiva.</p>${approvedDevices.length?knxCards(approvedDevices,true):'<div class="empty">Ancora nessuna associazione approvata. Importa ETS, correggi le proposte e conferma quelle verificate.</div>'}${drafts.length?`<div class="workspace-label" style="margin:25px 0 12px">Anteprima non salvata · verifica in Importa ETS</div>${knxCards(drafts)}`:''}`}
function syncDrafts(){document.querySelectorAll('.knx-row').forEach((row,i)=>{candidateDrafts[i]={...candidateDrafts[i],selected:row.querySelector('.knx-check').checked,name:row.querySelector('.knx-name').value,kind:row.querySelector('.knx-kind').value,command:row.querySelector('.knx-command').value,feedback:row.querySelector('.knx-feedback').value,room:row.querySelector('.knx-room').value,stop:row.querySelector('.knx-stop').value,position:row.querySelector('.knx-position').value}})}

function newWidget(kind,name='',fields={},source='manuale',room='Da assegnare',entity_id=''){return {id:++widgetSeq,kind,name:name||({light:'Nuova luce',dimmer:'Nuovo dimmer',cover:'Nuova tapparella'}[kind]),fields:{...fields},source,room,entity_id}}
function linkedGA(ga){return ga&&etsData?.addresses.some(a=>a.address===ga&&a.linked)?ga:''}
function etsRoomPaths(){return [...new Set((etsData?.building||[]).filter(s=>['Room','Corridor','Stairway'].includes(s.type)).map(s=>s.path))].slice(0,100)}
function nodePath(id,nodes=structureDraft){let map=new Map(nodes.map(n=>[n.id,n])),parts=[],seen=new Set();while(id&&map.has(id)&&!seen.has(id)){seen.add(id);let n=map.get(id);parts.unshift(n.name);id=n.parent}return parts.join(' / ')}
function structureRooms(onlyActive=true){return structureDraft.filter(n=>n.type==='room'&&(!onlyActive||n.active)&&(!onlyActive||structureAncestorsActive(n.id))).map(n=>nodePath(n.id))}
function structureAncestorsActive(id){let map=new Map(structureDraft.map(n=>[n.id,n]));while(id&&map.has(id)){let n=map.get(id);if(!n.active)return false;id=n.parent}return true}
function resolveRoomAlias(value){if(!value||value==='Da assegnare'||structureRooms(false).includes(value))return value;let same=structureRooms(false).filter(path=>path.split(' / ').pop()===value.split(' / ').pop());return same.length===1?same[0]:value}
function buildEditableStructure(spaces,legacyRooms=[]){
 let nodes=[],parents=new Map(),serial=0;
 const add=(type,name,parent,source='ets')=>{let id='nm_'+(++serial),clean=(name||'Senza nome').trim().slice(0,80);let names=new Set(nodes.filter(n=>n.parent===parent).map(n=>n.name.toLowerCase())),base=clean,i=2;while(names.has(clean.toLowerCase()))clean=(base.slice(0,73)+' '+(i++)).slice(0,80);nodes.push({id,parent,type,name:clean,active:true,source});return id};
 const root=()=>nodes.find(n=>n.type==='building')?.id||add('building','Edificio',null,'manual');
 const defaultFloor=building=>nodes.find(n=>n.parent===building&&n.type==='floor'&&n.name==='Altri ambienti')?.id||add('floor','Altri ambienti',building,'manual');
 for(let s of spaces||[]){let parentPath=s.path.split(' / ').slice(0,-1).join(' / '),parent=parents.get(parentPath),id;
  if(s.type==='Building')id=add('building',s.name,null);
  else if(s.type==='Floor'||s.type==='BuildingPart')id=add('floor',s.name,parent&&nodes.find(n=>n.id===parent)?.type==='building'?parent:root());
  else if(['Room','Corridor','Stairway'].includes(s.type)){let floor=parent&&nodes.find(n=>n.id===parent)?.type==='floor'?parent:defaultFloor(root());id=add('room',s.name,floor)}
  if(id)parents.set(s.path,id);
 }
 for(let path of legacyRooms){if(nodes.some(n=>n.type==='room'&&nodePath(n.id,nodes)===path))continue;let pieces=path.split(' / ').map(s=>s.trim()).filter(Boolean);if(!pieces.length)continue;let building=nodes.find(n=>n.type==='building'&&n.name===pieces[0])?.id||add('building',pieces.length>=3?pieces[0]:'Edificio',null,'manual');let floorName=pieces.length>=3?pieces[1]:'Altri ambienti',floor=nodes.find(n=>n.type==='floor'&&n.parent===building&&n.name===floorName)?.id||add('floor',floorName,building,'manual');add('room',pieces[pieces.length-1],floor,'manual')}
 return nodes.slice(0,250)
}

async function wireEntityMatching(){
  $('match-scan').onclick=async()=>{

  };

async function floorToRaster(file){
 if(file.size>5*1024*1024)throw Error('File sorgente troppo grande (max 5 MB)');
 if(!/\.(png|jpe?g|svg)$/i.test(file.name))throw Error('Formato non supportato');
 if(/\.svg$/i.test(file.name)){
   const source=await file.text();
   if(/<\s*(script|foreignObject|image|iframe)|<!DOCTYPE|<!ENTITY|\bon[a-z]+\s*=|\b(?:href|src)\s*=|url\s*\(|@import/i.test(source))throw Error('SVG con elementi esterni o attivi: esporta un SVG pulito oppure PNG');
 }
 const url=URL.createObjectURL(file),img=new Image();
 try{
   await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Immagine non leggibile'));img.src=url});
   if(!img.naturalWidth||!img.naturalHeight)throw Error('Dimensioni non valide');
   const scale=Math.min(1,1600/img.naturalWidth,1600/img.naturalHeight);
   const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
   canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
   const data=canvas.toDataURL('image/png');
   if(data.length>2.8*1024*1024)throw Error('Immagine elaborata oltre 2 MB: riduci la risoluzione');
   return data;
 }finally{URL.revokeObjectURL(url)}
}

  const steps=[
    {title:'Importa il progetto ETS',description:'Carica il .knxproj e analizza gli indirizzi di gruppo.',go:'ets',state:imported?'Progetto rilevato':'Da iniziare',done:imported},
    {title:'Organizza edificio e stanze',description:'Controlla piani, stanze e posizione dei dispositivi.',go:'building',state:rooms?rooms+' stanze salvate':'Da completare',done:rooms>0},
    {title:'Verifica i widget KNX',description:'Conferma luci, dimmer, tapparelle e GA necessari.',go:'widgets',state:widgets.length?(withCommands+'/'+widgets.length+' comandi presenti'):'Nessun widget salvato',done:widgets.length>0&&withCommands===widgets.length},
    {title:'Prepara le entità Home Assistant',description:'Rivedi e approva le entità mancanti. Il YAML non viene applicato automaticamente.',go:'ha-preview',state:widgets.length?'Revisione richiesta':'In attesa dei widget',done:false},
    {title:'Associa le entità esistenti',description:'Abbina manualmente o con suggerimenti le entità già presenti in HA.',go:'matches',state:linked+'/'+widgets.length+' collegate e presenti in HA',done:widgets.length>0&&linked===widgets.length},
    {title:'Genera la plancia Home Assistant',description:'Controlla la bozza e pubblica soltanto una nuova dashboard, con conferma.',go:'dashboard-export',state:'Anteprima da verificare',done:false}
  ];
  const complete=steps.filter(s=>s.done).length;
  return moduleWizard()+modulePreview()+`<section class="card"><div class="workspace-label">NM Studio 3.6 · Percorso installatore</div><h2>Avvio guidato 🐒</h2><p class="muted">Un passo alla volta, senza perdere la possibilità di intervenire sui dettagli tecnici. I controlli rimangono sempre nelle schermate dedicate.</p><div class="dash-hero" style="margin-top:20px"><div><div class="smart-label">Preparazione supervisione</div><h2>${complete}/${steps.length} fasi predisposte</h2><div class="stats">${widgets.length} widget KNX salvati · ${entities.length} entità HA disponibili · nessun comando automatico</div></div><span class="mode-pill">🔒 Modalità laboratorio</span></div><div class="bar"><button class="primary" data-wizard-go="${escapeHTML(steps.find(s=>!s.done)?.go||'dashboard-export')}">Continua dalla prossima fase</button><span class="small muted">Le fasi 4 e 6 richiedono sempre una conferma; i progressi non equivalgono a un impianto attivo.</span></div>${steps.map((s,i)=>`<div class="wizard-step"><div class="wizard-number">${i+1}</div><div><h3>${escapeHTML(s.title)}</h3><p class="small">${escapeHTML(s.description)}</p><p class="small" style="margin-top:7px;color:${s.done?'#8de2a9':'#ffd18a'}">${s.done?'✓ ': '○ '}${escapeHTML(s.state)}</p></div><button data-wizard-go="${escapeHTML(s.go)}">Apri</button></div>`).join('')}<div class="card"><div class="workspace-label">NM Studio · Backup e migrazione</div><h3>Trasferisci i dati su un'altra installazione</h3><p class="small muted">Esporta tutte le configurazioni locali in un JSON con impronta SHA-256. Sull'altro mini-PC importa il file solo in un'installazione vuota. Non verranno copiati token né credenziali HA.</p><div class="bar"><button id="migration-export">Scarica backup NM Studio</button><label class="small" style="max-width:350px">Seleziona backup JSON<input type="file" id="migration-file" accept=".json,application/json"></label><button id="migration-import" class="danger">Verifica e importa</button></div><p id="migration-status" class="small muted" aria-live="polite">Nessuna operazione effettuata.</p></div><p class="small warning">⚠️ Questo percorso guida la preparazione. L'applicazione di una configurazione KNX a Home Assistant non è ancora automatizzata: prima di attivarla servono backup, controllo GA/DPT e validazione della configurazione esistente.</p></section>`;
}
function wireWizard(){
  document.querySelectorAll('[data-module-role]').forEach(sel=>sel.onchange=()=>{
    const check=document.querySelector(`[data-module-verified="${sel.dataset.moduleRole}"][data-role="${sel.dataset.role}"]`);
    if(check){check.checked=false;check.disabled=!sel.value}
  });
  if($('module-suggest'))$('module-suggest').onclick=async()=>{
    const button=$('module-suggest');
    modulePlan=captureModulePlan();button.disabled=true;button.textContent='Ricerca in Home Assistant…';
    try{moduleSuggestions=await api('modules/suggestions');render()}
    catch(e){button.textContent='Ricerca non riuscita: '+e.message;button.disabled=false}
  };
  document.querySelectorAll('[data-module-enable]').forEach(input=>input.onchange=()=>{
    document.querySelectorAll(`[data-module-check="${input.dataset.moduleEnable}"]`).forEach(check=>check.disabled=!input.checked);
  });
  if($('module-plan-save'))$('module-plan-save').onclick=async()=>{
    const status=$('module-plan-status'),button=$('module-plan-save');
    button.disabled=true;status.textContent='Salvataggio checklist…';
    try{modulePlan=await api('modules/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(captureModulePlan())});status.textContent='Piano e associazioni salvati; nessuna attivazione effettuata.'}
    catch(e){status.textContent='Salvataggio non riuscito: '+e.message}
    finally{button.disabled=false}
  };
  document.querySelectorAll('[data-wizard-go]').forEach(b=>b.onclick=()=>{setPage(b.dataset.wizardGo);window.scrollTo({top:0,behavior:'smooth'})});
  const status=$('migration-status');
  $('migration-export').onclick=async()=>{
    let button=$('migration-export');button.disabled=true;status.textContent='Preparazione backup…';
    try{
      const backup=await api('migration/export');
      if(!backup.contains.length){status.textContent='Nessuna configurazione salvata da esportare.';return}
      const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download='nm-studio-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      status.textContent='Backup scaricato: '+backup.contains.join(', ')+' · verifica che il file sia presente sul PC prima di procedere.';
    }catch(e){status.textContent='Backup non riuscito: '+e.message}
    finally{button.disabled=false}
  };
  $('migration-import').onclick=async()=>{
    const file=$('migration-file').files[0];
    if(!file){status.textContent='Seleziona prima il file di backup JSON.';return}
    if(file.size>1024*1024){status.textContent='Il backup supera 1 MB: file rifiutato.';return}
    let bundle;
    try{bundle=JSON.parse(await file.text())}catch(e){status.textContent='Backup JSON non valido';return}
    if(bundle.format!=='nm-studio-migration'||bundle.version!==1||!Array.isArray(bundle.contains)){status.textContent='Non è un backup NM Studio compatibile.';return}
    if(!confirm('IMPORTAZIONE DATI NM STUDIO\n\nRipristinare '+bundle.contains.join(', ')+'?\nLa destinazione deve essere vuota: se contiene dati il server rifiuterà la richiesta.\nPrima scarica e conserva un backup anche di questa installazione.\nNessun comando KNX verrà inviato. Confermi?'))return;
    const button=$('migration-import');button.disabled=true;status.textContent='Verifica checksum e importazione in corso…';
    try{
      const r=await api('migration/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm:true,overwrite:false,bundle})});
      status.textContent='✓ Ripristinate '+r.restored+' sezioni. Ricarica la pagina per vedere tutti i dati importati.';
    }catch(e){status.textContent='Importazione rifiutata: '+e.message}
    finally{button.disabled=false}
  };
}
applyView();init();
</script></body></html>
